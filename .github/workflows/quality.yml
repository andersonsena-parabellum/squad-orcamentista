name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q scripts tests 03-BASE_DE_PRECOS/04-SCRIPTS 04-BASE_CONHECIMENTO_SUPAT/03-SCRIPTS
      - run: python -m unittest discover -s tests -v
